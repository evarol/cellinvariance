[project]
name = "cellinvariance"
version = "0.1.0"
description = "Cross-modality cell re-identification on paired in-vivo / ex-vivo GCaMP microscopy"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "torch>=2.2",
    "transformers>=4.40",
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "scikit-image>=0.22",
    "tifffile>=2024.1",
    "pillow>=10.0",
    "plotly>=5.20",
    "matplotlib>=3.8",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
